<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medea edu</title>
  <style>
/* =========================================================================
   Medea – výukový simulátor NIS
   Vzhled podle současné NIS Medea 3.60 ve Windows 11: bílé záhlaví oken,
   šedé formuláře, modrý výběr řádku, šedá pole jen pro čtení.
   ========================================================================= */

:root {
  --face: #F0F0F0;
  --face-2: #F7F7F7;
  --line: #D9D9D9;
  --line-2: #ADADAD;
  --field-border: #A0A0A0;
  --ro: #E3E3E3;
  --sel: #0078D7;
  --sel-text: #FFFFFF;
  --accent: #0067C0;
  --yellow: #FFFFA6;
  --yellow-2: #FFFFD9;
  --cave: #E00000;
  --desk-1: #0b2a6f;
  --desk-2: #1f5fc9;
  --font: "Segoe UI", Tahoma, Arial, sans-serif;
  --fs: 12px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  font-family: var(--font); font-size: var(--fs); color: #000;
  background: var(--desk-1);
  -webkit-user-select: none; user-select: none;
}
input, textarea, select, button { font-family: var(--font); font-size: var(--fs); }
textarea, input[type=text], input[type=password], input:not([type]), input[type=date], input[type=time], input[type=number], [contenteditable] {
  -webkit-user-select: text; user-select: text;
}
input[type=checkbox], input[type=radio] { accent-color: var(--sel); margin: 0 4px 0 0; vertical-align: -2px; }

/* ------------------------------------------------------------- plocha Windows 11 */
#desktop {
  position: absolute; inset: 0 0 48px 0; overflow: hidden;
  background:
    radial-gradient(ellipse 60% 70% at 72% 62%, rgba(140, 190, 255, .55) 0%, rgba(60, 120, 230, .25) 35%, transparent 65%),
    radial-gradient(ellipse 45% 55% at 60% 72%, rgba(200, 225, 255, .45) 0%, transparent 60%),
    linear-gradient(160deg, #06173f 0%, var(--desk-1) 35%, var(--desk-2) 100%);
}
#desktop .wallpaper {
  position: absolute; right: 28px; bottom: 22px; text-align: right;
  color: rgba(255,255,255,.45); pointer-events: none; line-height: 1.3;
}
#desktop .wallpaper b { font-size: 26px; font-weight: 300; display: block; letter-spacing: .5px; }
#desktop .wallpaper span { font-size: 12px; }
.dicon {
  position: absolute; left: 14px; top: 12px; width: 84px; padding: 6px 2px; border-radius: 4px; border: 1px solid transparent;
  display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; text-align: center; cursor: default;
  text-shadow: 0 1px 2px rgba(0,0,0,.8);
}
.dicon:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); }
.dicon.sel { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.4); }

#taskbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 48px; z-index: 100000;
  background: rgba(238, 242, 248, .94); border-top: 1px solid rgba(0,0,0,.12);
  display: flex; align-items: center; padding: 0 10px;
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
#taskbar .center { flex: 1; display: flex; justify-content: center; align-items: center; gap: 4px; min-width: 0; }
#taskbar .start, #taskbar .tb-btn {
  height: 40px; min-width: 40px; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 8px; cursor: default; position: relative; color: #000;
}
#taskbar .start:hover, #taskbar .tb-btn:hover { background: rgba(255,255,255,.7); }
#taskbar .tb-btn { max-width: 190px; }
#taskbar .tb-btn .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; }
#taskbar .tb-btn::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 6px; height: 3px; margin-left: -3px; border-radius: 2px; background: #8a8a8a; }
#taskbar .tb-btn.active { background: rgba(255,255,255,.85); }
#taskbar .tb-btn.active::after { width: 16px; margin-left: -8px; background: var(--accent); }
#taskbar .tray { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #000; }
#taskbar .tray .demo { background: #ffd24a; color: #000; padding: 1px 6px; border-radius: 3px; font-weight: 600; font-size: 11px; }
#taskbar .tray .clk { text-align: right; line-height: 1.25; }

/* ------------------------------------------------------------- okna (Windows 11) */
.win {
  position: absolute; display: flex; flex-direction: column;
  background: var(--face); border: 1px solid rgba(0,0,0,.35); border-radius: 8px;
  box-shadow: 0 8px 28px rgba(0,0,0,.32), 0 0 0 1px rgba(255,255,255,.1);
  min-width: 200px; min-height: 80px; overflow: hidden;
}
.win.inactive { box-shadow: 0 4px 14px rgba(0,0,0,.22); border-color: rgba(0,0,0,.25); }
.win > .tbar {
  height: 24px; flex: none; display: flex; align-items: center; gap: 6px; padding-left: 6px;
  background: #fff; color: #000; font-size: 12px; cursor: default;
}
.win.inactive > .tbar { color: #8a8a8a; }
.win > .tbar .ttl { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.win > .tbar .wico { width: 16px; height: 16px; flex: none; display: flex; }
.win > .tbar .tbtn {
  width: 46px; height: 24px; flex: none; display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #000; font-family: "Segoe UI Symbol", "Segoe UI", sans-serif;
}
.win > .tbar .tbtn:hover { background: #e9e9e9; }
.win > .tbar .tbtn.close:hover { background: #c42b1c; color: #fff; }
.win > .tbar .tbtn.dis { color: #c4c4c4; pointer-events: none; }
.win > .body { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; padding: 0 3px 3px; }
.win > .status {
  flex: none; height: 21px; padding: 3px 6px; border-top: 1px solid var(--line); background: var(--face);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #000;
}
.win .grip { position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; cursor: nwse-resize; z-index: 5; }
.win.maxed { border-radius: 0; }
.modal-shield { position: absolute; inset: 0; background: rgba(255,255,255,0); }

/* ------------------------------------------------------------- menu */
/* rozměry podle Medey: řádek menu 18 px, mezi texty položek 15 px */
.menubar { display: flex; flex: none; background: #fff; padding: 0 0 0 1px; height: 18px; }
.menubar .mi { padding: 0 6px 0 7px; line-height: 16px; cursor: default; border: 1px solid transparent; }
.menubar .mi:hover, .menubar .mi.open { background: #e5f3ff; border-color: #cce8ff; }
.menubar .mi.dis { color: #a0a0a0; }
.dropdown {
  position: fixed; z-index: 200000; background: #fbfbfb; border: 1px solid rgba(0,0,0,.14); border-radius: 8px;
  box-shadow: 0 8px 20px rgba(0,0,0,.18); padding: 4px; min-width: 210px;
}
.dropdown .di { display: flex; align-items: center; padding: 3px 14px 3px 6px; gap: 6px; white-space: nowrap; cursor: default; border-radius: 4px; min-height: 22px; }
.dropdown .di .ic { width: 20px; display: flex; justify-content: center; color: #000; }
.dropdown .di .lb { flex: 1; }
.dropdown .di .k { color: #000; margin-left: 30px; }
.dropdown .di:hover:not(.dis) { background: #ebebeb; }
.dropdown .di.dis, .dropdown .di.dis .k { color: #a0a0a0; }
.dropdown .di.sub { position: relative; padding-right: 22px; }
.dropdown .di.sub::after { content: "›"; position: absolute; right: 8px; font-size: 14px; color: #555; }
.dropdown .sep { height: 1px; background: #e2e2e2; margin: 4px 6px; }

/* ------------------------------------------------------------- lišta nástrojů */
/* jako v Medee: tlačítka 24 × 24 bez mezer, skupiny oddělené rytou čárou (šedá + bílá) */
.toolbar { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; padding: 1px 0 2px 2px; margin-top: 2px; flex: none; background: var(--face); border-top: 1px solid #a0a0a0; box-shadow: inset 0 1px #fff; min-height: 28px; }
.toolbar .tbi { width: 24px; height: 24px; margin: 0; display: flex; align-items: center; justify-content: center; border: 1px solid transparent; box-sizing: border-box; }
.toolbar .tbi:hover:not(.dis) { border-color: #99d1ff; background: #e5f3ff; }
.toolbar .tbi:active:not(.dis), .toolbar .tbi.on { background: #f7f7f7; border-color: #a0a0a0 #fff #fff #a0a0a0; }
.toolbar .tbi.dis .ico:not(.pixi) { opacity: .38; filter: grayscale(1); }
.toolbar .tsep { width: 1px; align-self: stretch; background: #a0a0a0; border-right: 1px solid #fff; margin: 0 1px 0 2px; }
.toolbar .tbgroup { display: flex; border: 1px solid #c8c8c8; margin-right: 3px; background: var(--face-2); }
.ico { display: inline-flex; width: 16px; height: 16px; flex: none; }
.ico svg { width: 100%; height: 100%; }
/* pixelové ikony: běžná a neaktivní (šedá s odleskem) podoba */
.ico.pixi svg { image-rendering: pixelated; }
.ico.pixi .pd, .dis .ico.pixi .pn, button:disabled .ico.pixi .pn { display: none; }
.dis .ico.pixi .pd, button:disabled .ico.pixi .pd { display: inline; }

/* ------------------------------------------------------------- ovládací prvky (klasické Windows) */
.btn {
  /* tlačítka jako na snímcích Medey (Windows 11): světlá, jemný okraj, zaoblené rohy */
  min-width: 75px; height: 23px; padding: 0 10px; border: 1px solid #d0d0d0; border-bottom-color: #bababa; border-radius: 4px;
  background: #fdfdfd; color: #000; cursor: default; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: #f5f9fd; border-color: #c4d7ea; border-bottom-color: #a9c0d8; }
.btn:active:not(:disabled) { background: #f0f0f0; border-color: #d0d0d0; color: #5c5c5c; }
.btn:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }
.btn.def { border-color: #0067c0; border-bottom-color: #003e73; }
.btn:disabled { color: #a0a0a0; border-color: #e5e5e5; background: #f5f5f5; }
.btn.sm { min-width: 0; height: 21px; padding: 0 6px; }
.btn.ico-only { min-width: 0; width: 25px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }

input[type=text], input[type=password], input:not([type]), input[type=date], input[type=time], input[type=number], select, textarea {
  border: 1px solid var(--field-border); background: #fff; height: 21px; padding: 1px 4px; outline: none; border-radius: 0; color: #000;
}
select { padding: 0 2px; }
textarea { height: auto; resize: none; line-height: 1.4; }
input:focus, textarea:focus, select:focus { border-color: var(--sel); }
input:disabled, textarea:disabled, select:disabled { background: #f0f0f0; color: #7a7a7a; border-color: #cfcfcf; }
input.ro, .ro { background: var(--ro); border: 1px solid var(--ro); font-weight: 600; color: #000; }
input.ro.n { font-weight: normal; }
input.req, select.req { background: var(--yellow); }
input.y, select.y { background: var(--yellow); }
input.cave, textarea.cave { color: var(--cave); font-weight: 600; }
label.chk { display: inline-flex; align-items: center; white-space: nowrap; }
label.chk.dis { color: #a0a0a0; }
fieldset { border: 1px solid var(--line); padding: 4px 6px 6px; margin: 0; }
legend { padding: 0 3px; color: #000; }

.row { display: flex; align-items: center; gap: 4px; }
.col { display: flex; flex-direction: column; gap: 3px; }
.grow { flex: 1; min-width: 0; }
.pad { padding: 6px; }
.fr { display: flex; align-items: center; gap: 4px; margin: 2px 0; }
.fr > label.l { text-align: right; flex: none; white-space: nowrap; }
.btnbar { display: flex; gap: 6px; padding: 6px 2px 3px; align-items: center; flex: none; }
.btnbar .sp { flex: 1; }
.sunken { border: 1px solid var(--field-border); background: #fff; }
.panel { border: 1px solid var(--line); padding: 4px; background: var(--face); }
.hint { color: #555; }
.red { color: var(--cave); }
.blue { color: #0033aa; }
.bold { font-weight: 600; }
.mono { font-family: Consolas, "Courier New", monospace; }

/* záložky */
.tabs { display: flex; padding-left: 2px; flex: none; position: relative; top: 1px; }
.tabs .tab { padding: 3px 10px; border: 1px solid #c8c8c8; border-bottom: none; background: #f0f0f0; margin-right: -1px; cursor: default; }
.tabs .tab.on { background: #fff; position: relative; z-index: 2; padding-bottom: 4px; margin-top: -2px; }
.tabpage { border: 1px solid #c8c8c8; background: #fff; padding: 6px; flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ------------------------------------------------------------- tabulka */
.grid { position: relative; background: #fff; border: 1px solid #828790; overflow: auto; outline: none; min-height: 40px; }
.grid table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.grid th {
  position: sticky; top: 0; z-index: 1; text-align: left; font-weight: normal; padding: 1px 4px; height: 19px;
  background: #fff; border-right: 1px solid #e5e5e5; border-bottom: 1px solid #d0d0d0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default;
}
.grid th:hover { background: #d9ebf9; }
.grid td { padding: 0 4px; height: 17px; border-right: 1px solid #d6d6d6; border-bottom: 1px solid #d6d6d6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grid tr.sel td { background: var(--sel); color: var(--sel-text); }
.grid tr.sel td:first-child { outline: 1px dotted #fff; outline-offset: -2px; }
.grid:not(:focus) tr.sel td { background: var(--sel); color: #fff; }
.grid.yellow { background: var(--yellow-2); }
.grid.yellow td { border-color: #cfcfa8; }
.grid.lined { background-image: repeating-linear-gradient(#fff 0 17px, #d6d6d6 17px 18px); }
.grid tr.b td { font-weight: 600; }
.grid tr.red td { color: #c00000; }
.grid tr.blue td { color: #0033aa; }
.grid tr.gray td { color: #888; }
.grid tr.sel.red td, .grid tr.sel.blue td, .grid tr.sel.gray td { color: #fff; }
.grid td.r, .grid th.r { text-align: right; }
.grid td.c, .grid th.c { text-align: center; }
.grid .empty { color: #888; padding: 6px; }
.gridhead-blue { background: #c9daf2; text-align: center; font-weight: 600; padding: 2px; border: 1px solid #828790; border-bottom: none; }

.vnav { display: flex; flex-direction: column; gap: 1px; width: 20px; flex: none; }
.vnav .btn { min-width: 0; width: 20px; height: 20px; padding: 0; font-size: 9px; background: #f0f0f0; border-color: #c8c8c8; border-radius: 3px; }
.vnav .btn.tall { height: 44px; }
.btn > span:empty { display: none; }
.btn.nav { min-width: 0; width: 20px; height: 22px; padding: 0; border-radius: 3px; }
.btn.nav.ikb { width: 24px; height: 24px; padding: 0; }
.toolbar .darr { display: flex; align-items: center; padding: 0 6px; }
.toolbar .darr:active { transform: translate(1px, 1px); }

/* ------------------------------------------------------------- dialogy */
.msgbox { display: flex; gap: 14px; padding: 16px 18px 8px; align-items: flex-start; max-width: 520px; background: #fff; }
.msgbox .mi { width: 32px; height: 32px; flex: none; }
.msgbox .mt { white-space: pre-wrap; line-height: 1.5; padding-top: 4px; -webkit-user-select: text; user-select: text; font-size: 13px; }
.msgfoot { background: var(--face); border-top: 1px solid var(--line); }

/* ------------------------------------------------------------- přihlášení */
.login { display: flex; flex-direction: column; background: #fff; }
.login .top { display: flex; padding: 8px 10px 4px; gap: 10px; }
.login .photo {
  width: 232px; height: 168px; flex: none; position: relative; overflow: hidden;
  background:
    radial-gradient(circle at 46% 40%, rgba(255,255,255,.9) 0 18px, transparent 19px),
    radial-gradient(ellipse at 44% 92%, rgba(255,255,255,.75) 0 64px, transparent 65px),
    linear-gradient(115deg, #f3f3f3 0%, #d9d9d9 45%, #bdbdbd 70%, #efefef 100%);
}
.login .photo::before { content: ""; position: absolute; left: 128px; top: 70px; width: 86px; height: 62px; border: 3px solid rgba(90,90,90,.35); border-radius: 3px; background: rgba(255,255,255,.35); }
.login .photo::after { content: "online"; position: absolute; left: 6px; top: 6px; font-size: 26px; color: rgba(255,255,255,.55); letter-spacing: 2px; font-weight: 300; }
.login .logo { flex: 1; display: flex; flex-direction: column; padding-top: 18px; }
.login .brand { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 26px; letter-spacing: .5px; color: #1d4f91; }
.login .brand b { font-weight: 600; color: #2a9d8f; }
.login .brand .mark { width: 24px; height: 24px; }
.login .sub { text-align: right; color: #1d6fb8; font-weight: 600; font-size: 10.5px; margin-top: 2px; letter-spacing: .3px; }
.login .ver { text-align: right; color: #a0a0a0; font-size: 12px; margin-top: 14px; }
.login .flds { margin-top: 18px; }
.login .flds input { background: #c0c0c0; border-color: #8a8a8a; width: 98px; }
.login .flds input:focus { background: #d0d0d0; }
.demo-banner { background: #fff6c8; border: 1px solid #e0c060; padding: 4px 8px; margin: 2px 10px 6px; line-height: 1.4; }

/* ------------------------------------------------------------- výběr pracoviště */
.vyber .hd { background: #e8e8e8; padding: 2px 4px; }
.vyber .gt { background: #c9daf2; text-align: center; font-weight: 600; padding: 2px; border: 1px solid #828790; border-bottom: none; }

/* ------------------------------------------------------------- ambulance */
.amb-filter { display: flex; align-items: center; gap: 8px; padding: 3px 4px 4px; flex: none; }
.amb-main { flex: 1; display: flex; gap: 8px; min-height: 0; padding: 0 2px; }
.amb-list { flex: 1.15; display: flex; flex-direction: column; min-width: 0; gap: 2px; }
.amb-list .lst { flex: 1; display: flex; gap: 2px; min-height: 0; }
.amb-detail { flex: 1; overflow: auto; padding-right: 2px; }
.amb-detail .fr > label.l { width: 108px; }
.amb-detail .fr input.ro { flex: 1; min-width: 0; }

/* ambulantní karta */
.karta-top { padding: 1px 2px; flex: none; height: 22px; gap: 3px; }
.karta-top + .karta-top { height: 24px; }
.karta-top .spin { display: flex; flex-direction: column; justify-content: center; width: 15px; margin-left: -19px; height: 18px; margin-top: 1px; font-size: 8px; line-height: 8px; color: #a0a0a0; background: #f0f0f0; text-align: center; z-index: 1; }
.karta-top .kgrey { width: 18px; height: 20px; background: #e3e3e3; flex: none; }
.karta-top .kinf { display: flex; flex-direction: column; width: 56px; margin-top: -6px; line-height: 13px; }
.karta-top .kinf .chk { height: 14px; }
.karta-top .kinf .row { height: 14px; gap: 2px; }
.karta-top .kinf input.ro { height: 14px; }
input.kdt { height: 19px; font-weight: 700; font-size: 13px; border: 1px solid #d0d0d0; border-bottom-color: #a0a0a0; background: #f6f6f6; padding: 0 2px; }
.karta-text {
  flex: 1; min-height: 60px; background: #fff; border: 1px solid #828790; padding: 4px 6px; overflow: auto;
  line-height: 1.4; -webkit-user-select: text; user-select: text; font-family: Arial, sans-serif; font-size: var(--edfont, 13px);
}
.karta-text .zh { white-space: pre; }
.karta-text .txt { white-space: pre-wrap; }
.karta-text b, .karta-text strong { font-weight: bold; }
.karta-new { flex: 1.6; display: flex; flex-direction: column; min-height: 0; gap: 2px; }
.karta-new .vl { display: flex; align-items: flex-start; gap: 6px; }
.karta-new .chks { display: flex; flex-direction: column; gap: 0; }
.ntab { display: flex; align-items: center; gap: 10px; flex: none; }
.ntab .lbl { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 4px; border: 1px solid #c8c8c8; border-bottom: none; background: #fff; font-weight: 600; }
.ntab .ti { display: inline-flex; gap: 10px; padding: 2px 8px; border: 1px solid #c8c8c8; border-bottom: none; background: #fff; }
.ntab .ti span { cursor: default; font-weight: 600; color: #1a3e9a; }
.ruler {
  height: 16px; flex: none; border: 1px solid #a0a0a0; border-bottom: none; position: relative; overflow: hidden;
  background: linear-gradient(#fff, #fff) 12px 0 / calc(100% - 24px) 100% no-repeat, #bdbdbd;
  font-size: 9px; color: #333;
}
.ruler .tk { position: absolute; top: 0; height: 100%; }
.editor-wrap { flex: 1; display: flex; flex-direction: column; min-height: 80px; border: 1px solid #a0a0a0; background: #fff; }
.editor {
  flex: 1; overflow: auto; padding: 6px 10px; outline: none; font-family: Arial, sans-serif; font-size: var(--edfont, 13px); line-height: 1.38;
  -webkit-user-select: text; user-select: text;
}
.editor:focus { outline: none; }
.edstat { display: flex; height: 18px; flex: none; background: #a9a9a9; font-size: 11px; }
.edstat span { border: 1px solid #8a8a8a; padding: 0 6px; background: #c4c4c4; margin: 1px 2px; }
.dglist { font-size: 11px; color: #333; }

/* zubní kříž */
.zk-wrap { display: flex; flex: 1; min-height: 0; gap: 6px; }
.zk-left { flex: 1; display: flex; flex-direction: column; min-width: 0; gap: 4px; }
.zk-right { width: 250px; flex: none; display: flex; flex-direction: column; gap: 4px; overflow: auto; }
.zk-tools { display: flex; flex-wrap: wrap; gap: 2px; }
.zk-tool { display: flex; align-items: center; gap: 4px; padding: 2px 6px 2px 3px; border: 1px solid #c8c8c8; background: #f7f7f7; cursor: default; }
.zk-tool.on { border-color: var(--sel); background: #cce4f7; font-weight: 600; }
.zk-tool .sw { width: 12px; height: 12px; border: 1px solid #555; flex: none; }

  <script>
/* js/util.js */
/* Pomocné funkce: tvorba DOM, data, rodné číslo, úložiště. */
'use strict';
window.M = window.M || {};

/* h('div', {class:'x', onclick: fn}, 'text', child, [children]) */
M.h = function (tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
  }
  const add = (c) => {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) return c.forEach(add);
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  };
  kids.forEach(add);
  return el;
};

M.esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
M.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
M.clone = (o) => JSON.parse(JSON.stringify(o));

/* ------------------------------------------------------------ datum a čas */
const pad = (n) => String(n).padStart(2, '0');
M.pad = pad;
M.now = () => new Date();
M.iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
M.isoDate = (d) => M.iso(d).slice(0, 10);
M.toDate = (s) => (s instanceof Date ? s : new Date(s.length === 10 ? s + 'T00:00' : s));
M.fD = (s) => { if (!s) return ''; const d = M.toDate(s); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`; };
M.fDs = (s) => { if (!s) return ''; const d = M.toDate(s); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${String(d.getFullYear()).slice(2)}`; };
M.fT = (s) => { if (!s) return ''; const d = M.toDate(s); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
M.fDT = (s) => (s ? M.fD(s) + ' ' + M.fT(s) : '');
M.fDTs = (s) => (s ? M.fDs(s) + ' ' + M.fT(s) : '');
M.addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
M.addMin = (d, n) => new Date(M.toDate(d).getTime() + n * 60000);
M.sameDay = (a, b) => M.isoDate(M.toDate(a)) === M.isoDate(M.toDate(b));
M.isToday = (s) => s && M.sameDay(s, new Date());
/* "12.3.2025" -> "2025-03-12" */
M.parseD = (s) => {
  const m = String(s || '').trim().match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{2,4})$/);
  if (!m) return null;
  let y = +m[3]; if (y < 100) y += y > 40 ? 1900 : 2000;
  const d = new Date(y, +m[2] - 1, +m[1]);
  if (d.getDate() !== +m[1]) return null;
  return M.isoDate(d);
};
M.age = (birth, at) => {
  const b = M.toDate(birth), a = at ? M.toDate(at) : new Date();
  let y = a.getFullYear() - b.getFullYear();
  if (a.getMonth() < b.getMonth() || (a.getMonth() === b.getMonth() && a.getDate() < b.getDate())) y--;
  return y;
};
M.DNY = ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'];
M.MESICE = ['leden', 'únor', 'březen', 'duben', 'květen', 'červen', 'červenec', 'srpen', 'září', 'říjen', 'listopad', 'prosinec'];

/* ------------------------------------------------------------ rodné číslo
   Pravidla (zákon č. 133/2000 Sb.): 10 číslic dělitelných 11 (u RČ vydaných
   před 1. 1. 1954 9 číslic bez kontroly); u žen +50 k měsíci; od roku 2004
   případně +20 k měsíci při vyčerpání koncovek. Výjimka: zbytek 10 -> kontrolní 0. */
M.rc = {
  clean: (s) => String(s || '').replace(/[\s/]/g, ''),
  format: (s) => { const c = M.rc.clean(s); return c.length > 6 ? c.slice(0, 6) + '/' + c.slice(6) : c; },
  check(s) {
    const c = M.rc.clean(s);
    if (!/^\d{9,10}$/.test(c)) return { ok: false, msg: 'Rodné číslo musí obsahovat 9 nebo 10 číslic (formát RRMMDD/XXXX).' };
    let yy = +c.slice(0, 2), mm = +c.slice(2, 4), dd = +c.slice(4, 6);
    let sex = 'M';
    if (mm > 70) { mm -= 70; sex = 'Z'; } else if (mm > 50) { mm -= 50; sex = 'Z'; } else if (mm > 20) { mm -= 20; }
    let year;
    if (c.length === 9) {
      year = 1900 + yy;
      if (year >= 1954) return { ok: false, msg: 'Devítimístné rodné číslo lze přidělit jen osobám narozeným před rokem 1954.' };
    } else {
      year = yy < 54 ? 2000 + yy : 1900 + yy;
      const n = BigInt(c);
      const ok = n % 11n === 0n || (BigInt(c.slice(0, 9)) % 11n === 10n && c[9] === '0');
      if (!ok) return { ok: false, msg: 'Rodné číslo nesplňuje kontrolu dělitelnosti 11.\nZkontrolujte prosím zadané číslice.' };
    }
    if (mm < 1 || mm > 12) return { ok: false, msg: 'Rodné číslo obsahuje neplatný měsíc narození.' };
    const d = new Date(year, mm - 1, dd);
    if (d.getMonth() !== mm - 1 || d.getDate() !== dd) return { ok: false, msg: 'Rodné číslo obsahuje neplatný den narození.' };
    if (d > new Date()) return { ok: false, msg: 'Datum narození odvozené z rodného čísla leží v budoucnosti.' };
    return { ok: true, birth: M.isoDate(d), sex };
  },
  /* vytvoří platné RČ k datu narození a pohlaví (pro demo data) */
  make(birthIso, sex, seq) {
    const d = M.toDate(birthIso);
    let mm = d.getMonth() + 1 + (sex === 'Z' ? 50 : 0);
    const base = pad(d.getFullYear() % 100) + pad(mm) + pad(d.getDate());
    for (let s = seq || 100; s < 999; s++) {
      const b9 = base + String(s).padStart(3, '0');
      const r = Number(BigInt(b9) * 10n % 11n);
      const k = (11 - r) % 11;
      if (k === 10) continue;
      return b9 + k;
    }
  },
};

/* ------------------------------------------------------------ BMI, povrch těla */
M.bmi = (vyska, vaha) => (vyska && vaha ? vaha / Math.pow(vyska / 100, 2) : null);
M.bsa = (vyska, vaha) => (vyska && vaha ? Math.sqrt((vyska * vaha) / 3600) : null); // Mosteller

/* ------------------------------------------------------------ úložiště */
M.STORE_KEY = 'medea-demo-v1';
M.store = {
  load() {
    try {
      const s = localStorage.getItem(M.STORE_KEY);
      if (s) { M.db = JSON.parse(s); if (M.db && M.db.ver === M.DATA_VER) return true; }
    } catch (e) { /* prohlížeč může úložiště blokovat – pracujeme jen v paměti */ }
    M.db = M.seed();
    M.store.save();
    return false;
  },
  save() {
    try { localStorage.setItem(M.STORE_KEY, JSON.stringify(M.db)); return true; } catch (e) {
      // plné úložiště (typicky velké přílohy) – upozornit jednou za běh
      if (e && /quota/i.test(e.name + e.message) && !M.store._warned && M.ui) { M.store._warned = true; setTimeout(() => M.ui.warn('Úložiště prohlížeče je plné, poslední změny se neuložily.\nSmažte nepotřebné přílohy (Centrální karta → Externí dokumenty).', 'Úložiště'), 0); }
      return false;
    }
  },
  reset() { M.db = M.seed(); M.store.save(); },
  exportJson() {
    const blob = new Blob([JSON.stringify(M.db, null, 1)], { type: 'application/json' });
    const a = M.h('a', { href: URL.createObjectURL(blob), download: `medea-demo-data-${M.isoDate(new Date())}.json` });
    document.body.appendChild(a); a.click(); a.remove();
  },
};

/* ------------------------------------------------------------ dotazy nad daty */
M.pat = (id) => M.db.patients.find((p) => p.id === id);
M.patName = (p) => `${p.prijmeni} ${p.jmeno}${p.titul ? ', ' + p.titul : ''}`;
M.user = () => M.session && M.session.user;
M.userName = () => (M.session ? M.session.user.name : '');
M.prac = () => M.session && M.session.prac;
M.cave = (p) => {
  const u = p.urg || {};
  const parts = [];
  if (u.alergie) parts.push('Alergie: ' + u.alergie);
  if (u.antikoag) parts.push('Antikoagulace: ' + (u.antikoagLek || 'ano'));
  if (u.bisfosf) parts.push('Bisfosfonáty / antiresorpční léčba');
  if (u.diabetes) parts.push('Diabetes mellitus');
  if (u.kardiostim) parts.push('Kardiostimulátor');
  if (u.endokarditida) parts.push('Riziko infekční endokarditidy – ATB profylaxe');
  if (u.infekce) parts.push('Infekce: ' + u.infekce);
  if (u.tehotenstvi) parts.push('Těhotenství');
  if (u.krevni) parts.push('Krevní sk.: ' + u.krevni);
  if (u.jine) parts.push(u.jine);
  return parts.join('; ');
};
M.log = (text) => { M.db.audit = M.db.audit || []; M.db.audit.unshift({ t: M.iso(new Date()), u: M.userName(), text }); M.db.audit.length = Math.min(M.db.audit.length, 300); };

</script>

M.icon = function (name, size) {
  const s = size || 16;
  const span = document.createElement('span');
  span.className = 'ico';
  span.style.width = span.style.height = s + 'px';
  // pixelová ikona (js/pix.js) v přirozené velikosti, pokud se do rámečku vejde
  const px = M.PIX && M.PIX[name];
  if (px && px[0] <= s && px[1] <= s) { span.classList.add('pixi'); span.innerHTML = M.pixSvg(name, s); return span; }
  span.innerHTML = `<svg viewBox="0 0 16 16" width="${s}" height="${s}" xmlns="http://www.w3.org/2000/svg">${M.ICONS[name] || ''}</svg>`;
  return span;
};

  /* ---------------------------------------------- okno zubního kříže */
  zk.open = function (p, prac, opt) {

    const detBox = h('div', { class: 'col' });
    const idxBox = h('div', { class: 'idx-box' });

    const histSel = ui.select([{ v: '', t: 'aktuální (rozpracovaný)' }].concat((p.zk || []).map((z, i) => ({ v: String(i), t: `${M.fD(z.dt)} – ${z.user}` })).reverse()), '', (v) => { viewOld = v === '' ? null : p.zk[+v]; draw(); }, 210);

    if (!M.session || document.getElementById('lockscreen')) return;
    const pwd = ui.inp({ type: 'password', w: 150 });
    const box = h('div', { id: 'lockscreen' },
      h('div', { class: 'win', style: { position: 'static', width: '360px' } },
        h('div', { class: 'tbar' }, h('span', { class: 'wico' }, M.icon('lock')), h('span', { class: 'ttl' }, 'NIS Medea – systém uzamčen')),
        h('div', { class: 'body pad' },
          h('div', { class: 'msgbox' }, h('span', { class: 'mi' }, M.icon('lock', 32)), h('div', { class: 'mt' }, `Systém je uzamčen uživatelem\n${M.userName()}.\n\nPro odemknutí zadejte heslo.`)),
          ui.fr('Heslo:', pwd, 60),
          h('div', { class: 'btnbar', style: { justifyContent: 'flex-end' } }, ui.btn('Odemknout', unlock, { def: true }), ui.btn('Jiný uživatel…', () => { box.remove(); M.login(true); })))));
    function unlock() { if (pwd.value === M.user().heslo) box.remove(); else { pwd.value = ''; pwd.style.background = '#fdd'; } }
    pwd.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.stopPropagation(); unlock(); } });
    document.body.appendChild(box);
    setTimeout(() => pwd.focus(), 30);
  };
  M.relogin = () => { if (M.session) ui.ask('Přihlásit se jako jiný uživatel?\nVšechna otevřená okna budou zavřena.').then((a) => a && M.login(true)); };

  /* ------------------------------------------------ nabídka Start na hlavním panelu */
  function startMenu(e) {
    const r = e.currentTarget.getBoundingClientRect();
    if (!M.session) { ui.popup([{ t: 'Spustit NIS Medea', a: () => M.login() }, { t: 'Nápověda a úkoly pro cvičení', a: () => M.help.open() }], r.left, r.top - 70); return; }
    const items = [
      { t: 'Výběr pracoviště a programu', a: M.vyber },
      { t: 'Centrální registr', ic: 'cr', a: () => M.cr.open() },
      { t: 'Medea Mail', ic: 'mail', a: () => M.mail.open() },
      { t: 'Nástěnka', ic: 'board', a: () => M.mail.nastenka() },
      { t: 'Prohlížení číselníků', ic: 'search', a: () => M.cis.open() },
      '-',
      { t: 'Nápověda a úkoly pro cvičení', ic: 'help', a: () => M.help.open() },
      M.user().role === 'lektor' ? { t: 'Lektorský panel', ic: 'teacher', a: () => M.lektor.open() } : null,
      '-',
      { t: 'Uzamknout', ic: 'lock', k: 'F12', a: M.lock },
      { t: 'Přihlásit jiného uživatele', ic: 'key', k: 'F11', a: M.relogin },
      { t: 'Uzavření NIS', a: M.quit },
    ].filter(Boolean);
    ui.popup(items, r.left, r.top - items.length * 21 - 10);
  }

  /* ------------------------------------------------ simulace na pozadí */
  M.tick = function () {
    if (!M.db) return;
    const fresh = M.zad.process();
    if (fresh.length && M.session) {
      M.changed();
      ui.toast('Došlé výsledky', `Došly nové výsledky (${fresh.length}): ${fresh.map((f) => f.pat).join(', ')}.\nKlikněte pro zobrazení.`, () => M.vysl.dosle());
    }
  };
  M.checkMail = function () {
    if (!M.session) return;
    const n = M.db.mail.filter((m) => !m.precteno && (m.komu === '*' || m.komu === M.user().login)).length;
    if (n) ui.toast('Medea Mail', `Máte ${n} nepřečtené zprávy. Klikněte pro otevření pošty.`, () => M.mail.open());
  };

  /* ------------------------------------------------ inicializace */
  window.addEventListener('DOMContentLoaded', () => {
    M.store.load();
    if (M.db.config) Object.assign(M.CONFIG, M.db.config);
    document.getElementById('tb-start').addEventListener('click', startMenu);
    ui.globalKeys = { F12: M.lock, F11: M.relogin, F1: () => M.help.open() };
    const clock = document.getElementById('tb-clock');
    const upd = () => { const n = new Date(); clock.innerHTML = ''; clock.append(M.fT(M.iso(n)), h('br'), `${n.getDate()}.${n.getMonth() + 1}.${n.getFullYear()}`); clock.title = M.DNY[n.getDay()] + ' ' + M.fD(M.iso(n)); };
    upd(); setInterval(upd, 15000);
    setInterval(M.tick, 15000);
    window.addEventListener('beforeunload', () => M.store.save());
    // ikona na ploše „Medea 12 - nova“
    const di = document.getElementById('dicon');
    document.getElementById('dicon-img').appendChild(M.icon('medea12', 44));
    di.addEventListener('click', () => di.classList.add('sel'));
    di.addEventListener('dblclick', () => { di.classList.remove('sel'); if (!M.session) M.login(); else M.vyber(); });
    document.getElementById('desktop').addEventListener('mousedown', (e) => { if (!e.target.closest('.dicon')) di.classList.remove('sel'); });
    M.login();
  });
})();

</script>
</body>
</html>
